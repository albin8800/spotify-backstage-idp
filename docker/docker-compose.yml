services:
  postgres:
    image: postgres:16-alpine
    container_name: backstage-postgres
    restart: always
    environment:
      POSTGRES_USER: backstage_user
      POSTGRES_PASSWORD: backstage_password
      POSTGRES_DB: backstage_plugin_catalog
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U backstage_user -d backstage_plugin_catalog']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
