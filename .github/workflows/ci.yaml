name: Secure Build & Publish

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} 

jobs:
  build-scan-push:
    runs-on: ubuntu-latest                                                                                                                                                                                                            
    permissions:                                                                                                                                                                                                                      
      contents: read                                                                                                                                                                                                                  
      packages: write      # Needed to push image to GHCR                                                                                                                                                                             
      security-events: write # Needed to upload Trivy scan results                                                                                                                                                                    
                                                                                                                                                                                                                                      
    steps:                                                                                                                                                                                                                            
      - name: Checkout repository                                                                                                                                                                                                     
        uses: actions/checkout@v4                                                                                                                                                                                                     
                                                                                                                                                                                                                                      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true # Loads image into local docker daemon for Trivy scanning
          tags: backstage:test 
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backstage:test'
          format: 'table'
          exit-code: '0' # Warn without failing initially; can be set to '1' for strict blocking
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
